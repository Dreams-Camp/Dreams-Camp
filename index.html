<style>

.price{font-size:26px;color:var(--ac2);font-weight:700}
.bubble{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;max-width:420px;margin:auto;background:var(--card);border:2px solid var(--ac);border-radius:20px;padding:14px;box-shadow:0 8px 30px #0004;z-index:20}
.hide{display:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.logo{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#fff}
.media>div{cursor:zoom-in;transition:.2s}.media>div.big{grid-column:1/-1;cursor:zoom-out}
.media>div.big img,.media>div.big video{height:auto;max-height:80vh;object-fit:contain;background:#000}
.bkb{border:2px solid var(--ac);border-radius:28px;padding:20px;margin:24px 0 90px;background:var(--card);box-shadow:0 10px 30px #0003}
textarea{font-family:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin:4px 0 10px;min-height:90px}
.ai{background:linear-gradient(90deg,#7c3aed,#2563eb)}input[type=color]{height:44px;padding:2px}
.rules li{margin:4px 0}
a.btn.g{background:var(--ac2)}
.tg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;font-size:13px;padding:8px 12px;box-shadow:0 4px 14px #0003}.tg.tr{right:8px}.tg.tl{left:8px;background:var(--ac2)}
.pnl{position:fixed;top:0;bottom:0;width:min(88vw,340px);background:var(--card);z-index:30;overflow:auto;padding:calc(58px + env(safe-area-inset-top,0px)) 14px 20px;box-shadow:0 0 30px #0006;transition:transform .25s}
.pnl.r{right:0;transform:translateX(110%)}.pnl.l{left:0;transform:translateX(-110%)}.pnl.open{transform:none}.pnl .media{grid-template-columns:1fr}.pnl .media>div.big{grid-column:auto}
.wrap{padding-top:60px}
.note.b{border-color:#2563eb}.note.o{border-color:#f59e0b}
@keyframes pop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
a.btn{text-decoration:none;display:inline-block}
#wm{position:fixed;inset:-25%;z-index:5;pointer-events:none;opacity:.08;display:flex;flex-wrap:wrap;gap:60px 80px;transform:rotate(-25deg);align-content:center;justify-content:center}
#wm span{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;color:var(--tx);white-space:nowrap}#wm img{width:36px;height:36px;border-radius:8px}

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:"AIzaSyBKlbj9mDxNUhwQtB7EFI1qpn47wHYkldY",authDomain:"dreams-camp.firebaseapp.com",projectId:"dreams-camp",storageBucket:"dreams-camp.firebasestorage.app",messagingSenderId:"926115501843",appId:"1:926115501843:web:5d76c4754b19a7bc3a2ce6",measurementId:"G-MP0Q0SWXF3"};
const ADMIN='dreamscamp.dmm@gmail.com';
const fapp=initializeApp(cfg),auth=getAuth(fapp),fs=initializeFirestore(fapp,{ignoreUndefinedProperties:true});
const wd=x=>({id:x.id,exists:x.exists(),data:()=>x.data()});
const D=p=>doc(fs,...p.split('/'));
const dbw={doc:p=>({get:async()=>wd(await getDoc(D(p))),set:d=>setDoc(D(p),d),update:d=>updateDoc(D(p),d),delete:()=>deleteDoc(D(p)),onSnapshot:cb=>onSnapshot(D(p),x=>cb(wd(x)),e=>console.warn(e))}),collection:n=>({onSnapshot:cb=>onSnapshot(collection(fs,n),q=>cb({docs:q.docs.map(wd)}),e=>console.warn(e))})};
window.loginForm=()=>{app.innerHTML=`<div class="card"><h2>🔐 دخول الأدمن</h2><label>البريد</label><input id="le" type="email" dir="ltr" value="${ADMIN}"><label>كلمة السر</label><input id="lp" type="password" dir="ltr"><button id="lb" style="width:100%">دخول</button><p id="lm" style="color:var(--rd)"></p><p><a href="#book">صفحة الزبائن</a></p></div>`;$('#lb').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value);location.reload()}catch(e){$('#lm').textContent='تعذر الدخول: تحقق من البريد وكلمة السر'}}};

async function upload(f,o={}){if(!f.type.startsWith('image/')){alert('الفيديو غير مدعوم في هذه النسخة، الصور فقط');throw new Error('img')}
const bm=await createImageBitmap(f);const cap=o.cap||600000;let k=Math.min(1,(o.max||1100)/Math.max(bm.width,bm.height)),q=o.q||.72,url='';
for(let i=0;i<5;i++){const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
if(!o.cap&&f.type==='image/png'&&i===0){const p=cv.toDataURL('image/png');if(p.length<400000)return {url:p}}
url=cv.toDataURL('image/jpeg',q);if(url.length<cap)break;k*=.8;q=Math.max(.4,q-.08)}
return {url}}
async function save({filename,data}){const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r&&r.code&&!r.__shown)alert('تعذرت العملية: '+r.code)});
let cu=await new Promise(res=>{const u=onAuthStateChanged(auth,x=>{u();res(x)})});
if(!cu){try{await signInAnonymously(auth);cu=auth.currentUser}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>تعذر الاتصال</h2><p>تأكد من تفعيل الدخول المجهول (Anonymous) في Firebase.</p></div>';throw e}}
const isAdmin=!cu.isAnonymous&&cu.email===ADMIN;
window.claude={use:async n=>({user:{id:async()=>cu.uid,canEdit:()=>isAdmin},db:dbw,assets:{upload},downloads:{save},sample:null,artifact:null})[n]||null};
init();
</script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const SNAP=(()=>{try{return JSON.parse($('#snap').textContent||'{}')}catch(e){return{}}})();
const S={exp:[],prevList:[],ratings:[],db:null,user:null,uid:null,isAdmin:false,settings:{p1:300,p2:500,dep:100,ins:200,name:'مخيمي',logo:'',desc:'',ac:'#b5651d',ac2:'#2f6f4f',loc:'',tel:'',guard:'',greview:'',prevDisc:10,prev:[],welcome:'مرحبًا بك في {name} 🌿 يسعدنا خدمتك.',seasons:[],notes:['حافظ على نظافة المخيم وارمِ النفايات في الأماكن المخصصة.','يمنع التخريب أو إتلاف المرافق والأثاث، وسيُحاسَب المتسبب بالتعويض.','الألعاب النارية والألعاب الهوائية ممنوعة منعًا باتًا حفاظًا على السلامة.','الالتزام بالهدوء بعد الساعة 11 مساءً واحترام الجيران.','إطفاء النار بالكامل قبل المغادرة أو النوم.','التأمين يُسترد عند تسليم المخيم سليمًا ونظيفًا.']},bookings:[],visits:[],likes:[],media:[],liked:false,counter:null};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd=d=>typeof d.data==='function'?d.data():d.data;
function dates(iso){if(!iso)return'';const d=new Date(iso+'T12:00:00');
 const g=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
 const h=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d);
 return {g,h}}
const daysTo=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const isAdminView=()=>location.hash==='#admin';

async function init(){
 try{S.user=await claude.use('user');S.db=await claude.use('db')}catch(e){}
 if(!S.db){if(isAdminView()||!SNAP.settings){app.innerHTML=isAdminView()?'<div class="card"><h2>لوحة التحكم تحتاج تسجيل الدخول بحساب المالك</h2></div>':'<div class="card"><h2>الصفحة غير جاهزة بعد</h2><p>لم تُنشر صفحة الزبائن بعد.</p></div>';return}Object.assign(S.settings,SNAP.settings);S.media=SNAP.media||[];S.uid='anon';window.addEventListener('hashchange',render);render();return}
 S.isAdmin=!!(S.user&&S.user.canEdit&&S.user.canEdit());
 try{S.uid=await S.user.id()}catch(e){S.uid='anon'+Math.random().toString(36).slice(2)}
 const db=S.db,t=setTimeout(()=>{if(!S.sl){S.late=1;render()}},6000);
 try{const c=JSON.parse(localStorage.getItem('campSet')||'null');if(c){Object.assign(S.settings,c);S.cached=1;const l=localStorage.getItem('campLogo'),h=localStorage.getItem('campHero');if(l)S.settings.logo=l;if(h)S.settings.heroBg=h}}catch(e){}
 db.doc('settings/main').onSnapshot(d=>{S.sl=1;if(d.exists)Object.assign(S.settings,dd(d));try{const c={...S.settings};delete c.logo;delete c.heroBg;localStorage.setItem('campSet',JSON.stringify(c))}catch(e){}render()});
 db.doc('settings/logo').onSnapshot(d=>{if(d.exists){S.settings.logo=dd(d).url;try{localStorage.setItem('campLogo',S.settings.logo)}catch(e){}render()}});
 db.doc('settings/hero').onSnapshot(d=>{if(d.exists){S.settings.heroBg=dd(d).url;try{localStorage.setItem('campHero',S.settings.heroBg)}catch(e){}render()}});
 db.collection('media').onSnapshot(q=>{S.media=q.docs.map(d=>({id:d.id,...dd(d)}));render()});
 db.collection('likes').onSnapshot(q=>{S.likes=q.docs.map(d=>d.id);S.liked=S.likes.includes(S.uid);render()});
 if(S.isAdmin){
  db.collection('bookings').onSnapshot(q=>{newDocs('bSeen',q,b=>toast('🎉 لديك حجز جديد!','العميل: '+(b.name||''),'#16a34a'));S.bookings=q.docs.map(d=>({id:d.id,...dd(d)})).sort((a,b)=>(b.at||0)-(a.at||0));render()});
  db.collection('ratings').onSnapshot(q=>{newDocs('rSeen',q,()=>toast('⭐ تعليق جديد','أضاف أحد العملاء تقييمًا للمخيم','#2563eb'));S.ratings=q.docs.map(d=>({id:d.id,...dd(d)}));render()});
  db.doc('admin/expenses').onSnapshot(d=>{S.exp=d.exists?(dd(d).list||[]):[];render()});
  db.doc('admin/prevlist').onSnapshot(d=>{S.prevList=d.exists?(dd(d).list||[]):[];render()});
  db.collection('visits').onSnapshot(q=>{S.visits=q.docs.map(d=>({id:d.id,...dd(d)}));render()});
 } else {
  db.doc('visits/'+S.uid).get().then(d=>{if(!d.exists)db.doc('visits/'+S.uid).set({at:Date.now(),answer:''}).catch(()=>{})}).catch(()=>{});
 }
 window.addEventListener('hashchange',render);render();
}

function theme(){const r=document.documentElement.style;r.setProperty('--ac',S.settings.ac);r.setProperty('--ac2',S.settings.ac2);if(S.settings.heroBg)r.setProperty('--hb','linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url("'+S.settings.heroBg+'") center/cover');else r.removeProperty('--hb');document.title=S.settings.name}
const brand=()=>`<div class="brand">${S.settings.logo?`<img class="logo" src="${S.settings.logo}" alt="">`:'<span style="font-size:40px">🏕️</span>'}<h1>${esc(S.settings.name)}</h1></div>`;
const saveSt=async p=>{if(!S.sl){alert('لم تكتمل قراءة الإعدادات من الخادم. تأكد من نشر القواعد في Firebase ثم أعد تحميل الصفحة.');const e0=new Error('not loaded');e0.__shown=1;throw e0}
const big={};['logo','heroBg'].forEach(k=>{if(k in p)big[k]=p[k]});Object.assign(S.settings,p);const main={...S.settings};delete main.logo;delete main.heroBg;
try{for(const k in big)await S.db.doc('settings/'+(k==='logo'?'logo':'hero')).set({url:big[k]||''});await S.db.doc('settings/main').set(main)}catch(e){alert('تعذر الحفظ: '+(e.code||e.message));e.__shown=1;throw e}};
async function ai(prompt,json){const sm=await claude.use('sample');if(!sm){alert('الذكاء الاصطناعي غير متاح');return null}try{return json?await sm.json(prompt):(await sm(prompt)).text}catch(e){alert('تعذر التوليد');return null}}
let _rt;function render(){clearTimeout(_rt);_rt=setTimeout(renderNow,150)}
function renderNow(){if(S.db&&!S.sl&&!S.cached&&!S.late){app.innerHTML='<p style="text-align:center;margin-top:30vh;color:var(--mu)">جارٍ التحميل…</p>';return}theme();const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id)return;
 if(isAdminView()){ if(!S.isAdmin){loginForm();return} renderAdmin();if(S.calOpen)renderCal()}
 else if(location.hash==='#rate')renderRate();else renderGuest();
}

/* ---------- Admin ---------- */
function renderAdmin(){
 const st=S.settings;const arch=S.bookings.filter(x=>archState(x)!==''),b=S.bookings.filter(x=>!arch.includes(x));
 const nw=b.filter(x=>x.status==='new'),ok=b.filter(x=>x.status==='approved'),no=[],rejN=S.bookings.filter(x=>x.status==='rejected').length;
 const noAns=S.visits.filter(v=>v.answer==='no').length;
 const notes=[];
 nw.forEach(x=>notes.push(['n','🎉 حجز جديد من '+x.name+' ليوم '+x.date]));
 S.ratings.slice(-3).forEach(r=>notes.push(['b','⭐ تقييم جديد '+r.stars+'/5'+(r.note?': '+r.note:'')]));
 ok.forEach(x=>{if(x.pay==='full')notes.push(['n','💰 '+x.name+' سدّد كامل المبلغ'])});
 ok.forEach(x=>{const n=daysTo(x.date);if(n>=0&&n<=2)notes.push(['w','⏰ تنبيه: حجز '+x.name+' '+(n===0?'اليوم':n===1?'غدًا':'بعد يومين')+' ('+x.date+')'])});
 ok.forEach(x=>{if(x.pay!=='full')notes.push(['w','💰 '+x.name+': '+(x.pay==='deposit'?'دفع العربون فقط':'لم يدفع')+' — المتبقي غير مسدد'])});
 ok.forEach(x=>{if(x.ins!=='paid')notes.push(['','🛡️ التأمين لم يُستلم من '+x.name])});
 S.bookings.filter(x=>archState(x)==='زبائن سابقون'&&remainNum(x)>0).forEach(x=>notes.push(['w','💰 '+x.name+': انتهى حجزه وعليه متبقي '+remainNum(x)+' ريال']));
 b.forEach(x=>{if(x.prevClaim&&!x.prevOk&&!x.prevCheck)notes.push(['w','⚠️ '+x.name+' يقول إنه زائر سابق لكن رقمه ('+x.phone+') غير مسجل — يلزم تأكيدك'])});
 no.forEach(x=>notes.push(['n','✖ رفض/لم يتم الاتفاق مع '+x.name]));
 const rows=b.map(x=>`<tr><td>${esc(x.name)}${histBadge(x)}${x.prevOk?' <span class="tag">زائر سابق ✓'+(x.prevCheck?' ('+esc(x.prevCheck)+')':'')+'</span>':x.prevClaim?(x.prevCheck?' <span class="tag">'+esc(x.prevCheck)+'</span>':'<br><span class="tag" style="background:var(--rd);color:#fff">رقم غير مسجل</span><br><button class="g" data-pc="yes" data-id="'+x.id+'">✔ رقم سابق</button> <button class="o" data-pc="chg" data-id="'+x.id+'">🔄 تغيّر الرقم</button> <button class="o" data-pc="no" data-id="'+x.id+'">؟ غير متأكد</button>'):''}</td><td>${esc(x.phone)}</td><td>${x.sections}</td><td>${esc(x.date)}<br><small>${esc(x.hijri)}</small></td><td>${x.price}${x.offer?'<br><small>مقترح: '+x.offer+'</small>':''}</td>
 <td>${stBadge(x)}</td><td>${remain(x)}</td>
 <td><select data-id="${x.id}" data-f="pay"><option value="none"${x.pay==='none'?' selected':''}>لم يدفع</option><option value="deposit"${x.pay==='deposit'?' selected':''}>عربون</option><option value="full"${x.pay==='full'?' selected':''}>كامل المبلغ</option></select><br><select data-id="${x.id}" data-f="method">${['نقد','تحويل','مدى','أخرى'].map(o=>`<option${x.method===o?' selected':''}>${o}</option>`).join('')}</select></td>
 <td><select data-id="${x.id}" data-f="ins"><option value="no"${x.ins!=='paid'?' selected':''}>لم يُستلم</option><option value="paid"${x.ins==='paid'?' selected':''}>مُستلم</option></select></td>

 if(done==='thanks')body='<h2>شكرًا لك على استفسارك 🌿</h2><p>نسعد بخدمتك في أي وقت.</p>';
 else if(done==='sent')body=WA?`<h2>خطوة أخيرة ✅</h2><p>اضغط الزر لإرسال طلبك إلينا عبر واتساب، وسنراجعه في أقرب وقت.</p><a class="btn" target="_blank" href="${WA}">إرسال الطلب عبر واتساب</a>`:'<h2>شكرًا لك ✅</h2><p>سيتم مراجعة طلبك في أقرب وقت.</p>';
 else if(step==='ask')body=`<h3>هل تريد حجز المخيم؟</h3><div class="tabs"><button class="g" id="yes">نعم</button><button class="r" id="no">لا</button></div>`;
 else body=`<h3>نموذج الحجز</h3>
  <label>الاسم الكامل</label><input id="nm">
  <label>هل أنت زائر سابق للمخيم؟</label><div class="tabs" style="margin-bottom:10px"><button class="o" id="vn">🆕 زائر جديد</button><button class="o" id="vp">🔁 زائر سابق</button></div><div class="note n hide" id="vmsg"></div>
  <label>عدد الأقسام</label><select id="sec"><option value="1">قسم واحد</option><option value="2">قسمان</option></select>
  ${svcHtml()}
  <label>يوم وتاريخ الحجز</label><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin:4px 0 12px"><div style="display:flex;gap:6px;flex:2;min-width:240px">${dateOpts()}</div><div class="pop" id="pop" style="flex:1.5;min-width:170px;margin:0">اختر التاريخ ليظهر الهجري</div></div>
  <div>السعر المقترح: <span class="price" id="pr"></span> ريال</div>
  <p id="extra" style="color:var(--mu)"></p>
  <label>رقم واتساب للتواصل</label><input id="ph" type="tel" inputmode="tel" placeholder="05xxxxxxxx">
  <label style="display:flex;gap:8px;align-items:center"><input id="ag" type="checkbox" style="width:auto;margin:0"> أوافق على التعليمات والإرشادات أعلاه</label><br>
  <a id="wab" class="btn g" target="_blank" style="width:100%;text-align:center;margin-bottom:8px">💬 تواصل واتساب للتفاوض على السعر</a>
  <button id="send" style="width:100%">إرسال الطلب</button>
  <div style="text-align:center;margin-top:10px"><button class="o" id="cbtn">💬 اقتراح سعر آخر</button></div>`;
 app.innerHTML=`${wm()}${panels(pm)}<div class="hero">${S.settings.logo?`<img class="logo" style="width:84px;height:84px" src="${S.settings.logo}" alt="">`:''}<h1>${S.settings.logo?'':'🏕️ '}${esc(st.name)}</h1><p>${esc(st.desc||'مخيم للإيجار اليومي')}</p>
 ${S.db?`<button id="lk" style="background:#fff;color:#b3382c">${S.liked?'❤️':'🤍'} إعجاب (${S.likes.length})</button>`:''}</div>${gal}${rules}${contact()}
 <div class="bkb" id="bk">${body}</div>
 <div class="card" style="text-align:center;margin-bottom:90px"><h3>🔗 شارك المخيم</h3><div id="qrG" style="display:inline-block;background:#fff;padding:10px;border-radius:12px"></div><div class="tabs" style="justify-content:center;margin-top:10px"><button id="gCopy">📋 نسخ الرابط</button><a class="btn g" target="_blank" href="https://wa.me/?text=${encodeURIComponent(waShare())}">💬 مشاركة بواتساب</a></div></div>
 <div class="bubble hide" id="cb"><b>اقترح سعرًا آخر</b><input id="co" type="number" placeholder="السعر الذي تقترحه"><button class="o" onclick="$('#cb').classList.add('hide')">إغلاق</button></div>`;
 app.querySelectorAll('.media>div').forEach(e=>e.onclick=ev=>{if(ev.target.tagName==='VIDEO'&&!e.classList.contains('big')){}e.classList.toggle('big')});
 bindPanels();
 try{const g=$('#qrG');if(g)new QRCode(g,{text:baseUrl(),width:150,height:150})}catch(e){}
 if($('#gCopy'))$('#gCopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(baseUrl());alert('تم نسخ الرابط')};
 if($('#lk'))$('#lk').onclick=()=>{const r=S.db.doc('likes/'+S.uid);(S.liked?r.delete():r.set({at:Date.now()})).catch(()=>{})};
 if($('#yes')){$('#yes').onclick=()=>{S.db&&S.db.doc('visits/'+S.uid).set({at:Date.now(),answer:'yes'}).catch(()=>{});step='form';renderGuest();$('#bk').scrollIntoView({behavior:'smooth'})};
  $('#no').onclick=()=>{S.db&&S.db.doc('visits/'+S.uid).set({at:Date.now(),answer:'no'}).catch(()=>{});done='thanks';renderGuest()}}
 if($('#send'))bindForm();
}
function bindForm(){
 const calc=()=>{const n=+$('#sec').value;const pr=priceFor(getDate(),n);let p=pr.p;if(PV.ok)p=Math.round(p*(100-(S.settings.prevDisc||0))/100);p+=[...document.querySelectorAll('.svc:checked')].reduce((a,e)=>a+(+e.dataset.p||0),0);$('#pr').textContent=p;
  $('#extra').textContent=(pr.sname?'الموسم: '+pr.sname+' — ':'')+'العربون: '+pr.dep+' ريال — التأمين: '+pr.ins+' ريال';const w=$('#wab');if(w){const dv=getDate();w.href='https://wa.me/'+waNum(S.settings.tel)+'?text='+encodeURIComponent(waMsg(p,pr.dep,pr.ins,dv?dates(dv).g:''))}return p};
 calc();$('#sec').onchange=calc;document.querySelectorAll('.svc').forEach(e=>e.onchange=calc);
 const styl=()=>{$('#vn').className=PV.claim?'o':'g';$('#vp').className=PV.claim?'g':'o'};styl();
 const chk=async()=>{PV.ok=false;const m=$('#vmsg'),ph=$('#ph').value;if(PV.claim){m.classList.remove('hide');if(ph.replace(/\D/g,'').length>=9){PV.ok=(S.settings.prev||[]).includes(await hashP(ph));m.textContent=PV.ok?'أهلًا بعودتك! 🎉 تم تطبيق خصم الزبون السابق '+S.settings.prevDisc+'%':'لم نجد رقمك ضمن الزبائن السابقين، وسيراجع الأدمن طلبك.'}else m.textContent='اكتب رقم الواتساب المسجل سابقًا ليظهر السعر الخاص.'}else m.classList.add('hide');calc()};
 $('#vn').onclick=()=>{PV.claim=false;styl();chk()};$('#vp').onclick=()=>{PV.claim=true;styl();chk()};$('#ph').oninput=chk;
 ['dd','mm','yy'].forEach(k=>$('#'+k).onchange=()=>{const v=getDate(),p=$('#pop');calc();if(v){const d=dates(v);p.innerHTML='📅 '+d.g+'<br>🌙 الموافق: '+d.h}else p.textContent='اختر التاريخ ليظهر الهجري'});
 $('#cbtn').onclick=()=>$('#cb').classList.remove('hide');
 $('#send').onclick=async()=>{
  const name=$('#nm').value.trim(),phone=$('#ph').value.trim(),date=getDate();
  if(!name||!phone||!date){alert('أكمل الاسم والتاريخ ورقم الواتساب');return}
  if(daysTo(date)<0){alert('اختر تاريخًا قادمًا');return}
  if(!$('#ag').checked){alert('يرجى الموافقة على التعليمات');return}
  const d=dates(date),p=calc();
  const rec={name,phone,date,hijri:d.h,sections:+$('#sec').value,price:p,offer:+($('#co')&&$('#co').value)||0,deposit:priceFor(date,+$('#sec').value).dep,insurance:priceFor(date,+$('#sec').value).ins,services:[...document.querySelectorAll('.svc:checked')].map(e=>e.dataset.n),prevClaim:PV.claim,prevOk:PV.ok,status:'new',pay:'none',ins:'no',at:Date.now()};
  try{if(S.db)await S.db.doc('bookings/'+S.uid).set(rec);else{const w=waNum(S.settings.tel);if(!w){alert('رقم التواصل غير مضبوط');return}const t='طلب حجز جديد - '+S.settings.name+'\nالاسم: '+name+'\nالأقسام: '+rec.sections+'\nالتاريخ: '+date+' ('+d.h+')\nالسعر: '+p+' ريال'+(rec.offer?'\nالسعر المقترح من الزبون: '+rec.offer:'')+'\nزائر سابق: '+(PV.claim?(PV.ok?'نعم (مؤكد)':'نعم (يدّعي)'):'لا')+'\nواتساب: '+phone;WA='https://wa.me/'+w+'?text='+encodeURIComponent(t)}done='sent';renderGuest()}catch(e){alert('تعذر الإرسال')}};
}
if(!window.__FB)init();
</script>
</body>
</html>
